[pytest]
# 仓库根跑测收口（[DEV-SK05C]，QA-SK05B P4/S5）：
# outputs/、scripts/ 下有 9 月遗留的手工脚本（test_myapi_gateway.py / e3_gr_put_test.py /
# e3_others_gw_test.py，带网络请求或可选依赖），裸跑 pytest 会被误收集报错（root rc=2）。
# 根目录只收离线单测，与 backend/pytest.ini 口径一致；跑法不带额外 -q（见坑库 E21）。
testpaths = backend/tests/unit
pythonpath = backend
addopts = -q
# WorkBuddy 沙箱会拦截批量删除，关掉 tmp_path 保留（与 backend/pytest.ini 同因）
tmp_path_retention_policy = none
